app.gmail.host=smtp.gmail.com
app.gmail.port=587
app.gmail.username=example@email.com
app.gmail.password= #getyourAppCode
app.gmail.properties.mail.smtp.auth=true
app.gmail.properties.mail.smtp.starttls.enable=true


# Optional but helpful
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Topic Configuration
app.kafka.topics.patient-registered=patient.registered

# Bootstrap Servers (used by both producer and consumer)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# ===== CONSUMER Configuration =====
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# IMPORTANT: Set to FALSE to use manual acknowledgment
spring.kafka.consumer.enable-auto-commit=false

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust all packages for deserialization (use cautiously in production)
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ACK Mode - REQUIRED for manual acknowledgment
spring.kafka.listener.ack-mode=manual

# ===== PRODUCER Configuration =====
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Idempotence settings
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3